name: JuBrowse 6.0 Beta builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v6.0.0-beta*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-intel
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        working-directory: desktop
        run: npm run dist -- --win nsis
      - name: Build macOS ARM64 DMG and app ZIP
        if: matrix.platform == 'macos-arm64'
        working-directory: desktop
        run: npm run dist -- --mac dmg zip --arm64
      - name: Build macOS Intel DMG and app ZIP
        if: matrix.platform == 'macos-intel'
        working-directory: desktop
        run: npm run dist -- --mac dmg zip --x64
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: npm run dist -- --linux AppImage
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JuBrowse-6.0-beta-${{ matrix.platform }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v6.0.0-beta')
        uses: softprops/action-gh-release@v2
        with:
          name: JuBrowse 6.0 beta
          prerelease: true
          generate_release_notes: true
          files: desktop/release/*
